docs_redirect:
    path: /docs
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: api_doc
        permanent: false

docs_json_redirect:
    path: /docs.json
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: api_doc
        permanent: false

api_platform:
    resource: .
    type: api_platform
    prefix: /api